events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" Upstream: $upstream_addr ($upstream_response_time s)';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Definición del clúster de microservicios (Upstream)
    # 3 réplicas balanceadas por Round-Robin con Health Checks pasivos integrados
    upstream microservices_backend {
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        server app3:8000 max_fails=3 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Endpoint de salud del clúster (Health Check)
        location /health {
            proxy_pass http://microservices_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Resiliencia y conmutación por error ante fallas
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Endpoint principal y resto de la API REST
        location / {
            proxy_pass http://microservices_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Configuración de resiliencia y tolerancia a fallos
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # Encabezados para trazabilidad del balanceador y réplica asignada
            add_header X-Served-By $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;
        }
    }
}
